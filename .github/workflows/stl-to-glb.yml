# Written by Claude
name: STL to GLB

on:
  push:
    branches: [main]
    paths:
      - '**/*.stl'
      - '**/*.STL'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find STL files
        id: changed
        run: |
          find . -iname '*.stl' -not -path './.git/*' | sed 's|^\./||' > /tmp/changed_stls.txt
          echo "count=$(wc -l < /tmp/changed_stls.txt)" >> $GITHUB_OUTPUT

      - name: Install Blender
        if: steps.changed.outputs.count != '0'
        run: |
          sudo apt-get update
          sudo apt-get install -y blender

      - name: Convert STLs to GLB (staged, same relative paths)
        run: |
          mkdir -p /tmp/glb_out
          while IFS= read -r stl; do
            rel="${stl%.*}.glb"
            out="/tmp/glb_out/$rel"
            mkdir -p "$(dirname "$out")"
            blender --background --python scripts/convert_with_material.py -- "$stl" "$out"
          done < /tmp/changed_stls.txt

      - name: Publish to glb-assets branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin glb-assets 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/glb-assets; then
            git checkout glb-assets
          else
            git checkout --orphan glb-assets
          fi
          git rm -rf . >/dev/null 2>&1 || true

          mkdir -p /tmp/glb_out
          cp -r /tmp/glb_out/. .

          git add .
          if git diff --cached --quiet; then
            echo "No GLB changes"
          else
            git commit -m "Sync GLB assets from ${{ github.sha }}"
            git push origin glb-assets
          fi