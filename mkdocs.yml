# mkdocs.yml
site_name: Trappy-Scopes/trappyframe
site_url: https://trappy-scopes.github.io/trappyframe
repo_url: https://github.com/Trappy-Scopes/trappyframe

nav:
  - Home: index.md
  - Frame Elements:
    - trappyframe/index.md
  - Electronics & Optics:
      - notes/electro_optics.md
  - Bill of Materials:
      - notes/bom.md
  - Assembly Instructions:
      - notes/assembly.md
  - Calibrations: notes/calibration/    # pages and nav generated from calibrations/
  - Disassembly Instructions :
      - notes/disassembly.md
  
  - All Trappy-Scopes Projects: https://trappy-scopes.github.io


plugins:
  - search
  - blogging
  - table-reader          # before external-markdown, which renders every {{ }} itself
  - external-markdown
  - mermaid2
  - gen-files:
      scripts:
        - scripts/gen_calibration_pages.py   # notebooks + results from calibrations/
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocs-jupyter:
      execute: false          # notebooks are committed with their outputs; CI has no data
      include_source: true
  - glightbox

#  - autorefs
#  - redirects
#      scripts:
#        - generate_docs.py

extra:
  homepage: https://trappy-scopes.github.io/trappyscopes/
  colab: https://colab.research.google.com/github/Trappy-Scopes/trappyframe/blob/main/calibrations   # Open in Colab, on notebook pages

theme:
  logo: assets/tsicon.png
  name: material
  custom_dir: overrides       # notebook pages: Download / Open in Colab buttons
  primary: trappytheme
  palette:
    # Dark mode as default
    - scheme: slate
      primary: cyan
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    # Light mode option
    - scheme: default
      primary: cyan
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - toc.integrate
    - search.highlight
    - content.code.annotate
    - content.code.copy

extra_css:
  - stylesheets/extra.css


markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.highlight
  - attr_list
  - md_in_html
  - tables
  ## One superfences entry: repeated entries override each other, and the
  ## last one used to drop the mermaid fence, so diagrams rendered as code.
  - pymdownx.superfences:
      # make exceptions to highlighting of code:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
        - name: model-viewer
          class: model-viewer
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_javascript:
  - javascripts/notebook.js
  - https://cdn.jsdelivr.net/npm/es-module-shims@1.8.3/dist/es-module-shims.min.js
  - https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js
  - https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js